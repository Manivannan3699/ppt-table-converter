<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPTX Table Converter</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
:root {
  --bg0:#0f1117; --bg1:#171b24; --bg2:#1e2330; --bg3:#252b3b;
  --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.14);
  --accent:#4f8ef7; --accent2:#3a7bf5;
  --text1:#f0f2f8; --text2:#8b93a8; --text3:#555e72;
  --green:#30c97e; --red:#f25c5c;
  --r:10px; --rsm:6px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg0);color:var(--text1);font-family:system-ui,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px;}
#shell{width:100%;max-width:1140px;background:var(--bg1);border:1px solid var(--border2);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:84vh;}

/* titlebar */
#titlebar{background:var(--bg1);border-bottom:1px solid var(--border);padding:0 18px;height:52px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.logo{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--text1);}
.logo i{font-size:20px;color:var(--accent);}
.divx{width:1px;height:22px;background:var(--border2);margin:0 4px;}
.tl-sp{flex:1;}
.btn{height:32px;padding:0 14px;border:1px solid var(--border2);border-radius:var(--rsm);background:var(--bg2);color:var(--text1);font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .14s,border-color .14s;white-space:nowrap;}
.btn:hover{background:var(--bg3);border-color:rgba(255,255,255,.22);}
.btn-primary{background:var(--accent);border-color:transparent;font-weight:500;color:#fff;}
.btn-primary:hover{background:var(--accent2);}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;pointer-events:none;}
.btn-sm{height:26px;padding:0 10px;font-size:11px;}

/* progress */
#pbar{height:2px;background:var(--bg0);flex-shrink:0;display:none;}
#pbar.show{display:block;}
#pfill{height:100%;width:0%;background:var(--accent);transition:width .22s;}

/* body */
#body{display:flex;flex:1;min-height:0;}

/* sidebar */
#left{width:248px;flex-shrink:0;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px;gap:14px;overflow-y:auto;}
.plabel{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;}
.hdiv{width:100%;height:1px;background:var(--border);margin:2px 0;}

/* drop zone */
#dz{border:1.5px dashed var(--border2);border-radius:var(--r);padding:22px 12px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;display:flex;flex-direction:column;align-items:center;gap:7px;}
#dz:hover,#dz.drag{border-color:var(--accent);background:rgba(79,142,247,.06);}
#dz i{font-size:30px;color:var(--text3);}
#dz .dzt{font-size:13px;font-weight:500;color:var(--text2);}
#dz .dzs{font-size:11px;color:var(--text3);}
#fname{font-size:11px;color:var(--green);text-align:center;min-height:14px;word-break:break-all;line-height:1.5;}

/* option rows */
.opt{display:flex;flex-direction:column;gap:5px;}
.opt label{font-size:11px;color:var(--text2);}
.opt select{height:30px;padding:0 8px;border:1px solid var(--border2);border-radius:var(--rsm);background:var(--bg2);color:var(--text1);font-size:12px;width:100%;}
.opt select:focus{outline:none;border-color:var(--accent);}

/* stats */
#stats{display:none;flex-direction:column;gap:5px;}
.stat{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);}
.stat b{color:var(--text1);font-weight:500;}

/* right */
#right{flex:1;display:flex;flex-direction:column;background:var(--bg0);min-width:0;}
#ptbar{height:40px;background:var(--bg1);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 14px;flex-shrink:0;}
#searchbox{height:26px;padding:0 9px;border:1px solid var(--border2);border-radius:var(--rsm);background:var(--bg2);color:var(--text1);font-size:12px;width:190px;}
#searchbox:focus{outline:none;border-color:var(--accent);}
#matchcount{font-size:11px;color:var(--text3);min-width:70px;}
.pts{flex:1;}

/* preview */
#pwrap{flex:1;overflow:auto;padding:20px;}
#pwrap::-webkit-scrollbar{width:5px;}
#pwrap::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
#empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;color:var(--text3);}
#empty i{font-size:40px;}
#empty p{font-size:13px;}
#tout{display:none;}

/* table styles */
.tbl-wrap{margin-bottom:28px;}
.tbl-label{font-size:11px;color:var(--text3);margin-bottom:6px;display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;}
.tbl-label::before{content:'';display:inline-block;width:3px;height:13px;background:var(--accent);border-radius:2px;flex-shrink:0;}
.tbl-label .arrow{margin-left:auto;font-size:13px;transition:transform .15s;}
.tbl-label.collapsed .arrow{transform:rotate(-90deg);}
.tbl-inner{overflow-x:auto;}
table{border-collapse:collapse;font-family:system-ui,Arial,sans-serif;font-size:13px;}
table td,table th{border:1px solid rgba(255,255,255,.12);padding:6px 10px;vertical-align:top;line-height:1.45;}
table th{font-weight:600;}
table p{margin:1px 0;}
mark{background:rgba(79,142,247,.38);color:inherit;border-radius:2px;padding:0 1px;}

/* statusbar */
#sbar{height:28px;background:var(--bg1);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:8px;flex-shrink:0;}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--text3);flex-shrink:0;}
.sdot.ok{background:var(--green);}
.sdot.busy{background:var(--accent);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
#smsg{font-size:11px;color:var(--text3);}
</style>
</head>
<body>

<div id="shell">
  <div id="titlebar">
    <div class="logo"><i class="ti ti-table"></i> PPTX Table Converter</div>
    <div class="divx"></div>
    <span style="font-size:11px;color:var(--text3);"><i class="ti ti-brand-javascript" style="color:#f7df1e;font-size:14px;vertical-align:-2px;"></i>  Python Engine • Accurate PPT Table Extraction</span>
    <div class="tl-sp"></div>
    <button class="btn btn-sm" id="copy-btn" style="display:none" onclick="copyHTML()"><i class="ti ti-copy"></i> Copy HTML</button>
    <button class="btn btn-primary" id="dl-btn" disabled onclick="downloadHTML()"><i class="ti ti-download"></i> Download HTML</button>
  </div>

  <div id="pbar"><div id="pfill"></div></div>

  <div id="body">
    <div id="left">
      <div class="plabel">Source File</div>

      <div id="dz" onclick="document.getElementById('fin').click()">
        <i class="ti ti-file-upload"></i>
        <div class="dzt">Drop PPTX here</div>
        <div class="dzs">or click to browse</div>
      </div>
      <input type="file" id="fin" accept=".pptx" style="display:none">
      <div id="fname"></div>

      <div class="hdiv"></div>
      <div class="plabel">Output Options</div>

      <div class="opt">
        <label>Table border</label>
        <select id="opt-border">
          <option value="1px solid rgba(255,255,255,.15)">Dark mode thin</option>
          <option value="1px solid #ccc">Light grey</option>
          <option value="2px solid #555">Bold dark</option>
          <option value="none">No border</option>
        </select>
      </div>

      <div class="opt">
        <label>Font size</label>
        <select id="opt-fs">
          <option value="">From slide</option>
          <option value="11px">11 px</option>
          <option value="13px" selected>13 px</option>
          <option value="14px">14 px</option>
          <option value="16px">16 px</option>
        </select>
      </div>

      <div class="opt">
        <label>Cell padding</label>
        <select id="opt-pad">
          <option value="4px 8px">Compact</option>
          <option value="6px 10px" selected>Normal</option>
          <option value="10px 16px">Comfortable</option>
        </select>
      </div>

      <div class="opt">
        <label>Min table width</label>
        <select id="opt-width">
          <option value="100%">Full width</option>
          <option value="auto" selected>Auto (from slide)</option>
          <option value="600px">600 px</option>
          <option value="800px">800 px</option>
        </select>
      </div>

      <button class="btn btn-primary" id="cvt-btn" onclick="convert()" disabled><i class="ti ti-bolt"></i> Convert</button>

      <div id="stats">
        <div class="stat"><span>Slides</span><b id="st-sl">—</b></div>
        <div class="stat"><span>Tables found</span><b id="st-tb">—</b></div>
        <div class="stat"><span>Rows extracted</span><b id="st-rw">—</b></div>
      </div>
    </div>

    <div id="right">
      <div id="ptbar">
        <i class="ti ti-search" style="color:var(--text3);font-size:15px;"></i>
        <input id="searchbox" type="text" placeholder="Search table content…" oninput="doSearch(this.value)">
        <span id="matchcount"></span>
        <div class="pts"></div>
        <button class="btn btn-sm" onclick="expandAll(true)"><i class="ti ti-arrows-maximize"></i></button>
        <button class="btn btn-sm" onclick="expandAll(false)"><i class="ti ti-arrows-minimize"></i></button>
      </div>
      <div id="pwrap">
        <div id="empty"><i class="ti ti-table-off"></i><p>Upload a PPTX and click Convert</p></div>
        <div id="tout"></div>
      </div>
    </div>
  </div>

  <div id="sbar"><div class="sdot" id="sdot"></div><span id="smsg">Ready — drop a PPTX file to begin</span></div>
</div>


<script>
// ─────────────────────────────────────────────────────────────────────────────
// Globals
// ─────────────────────────────────────────────────────────────────────────────
let latestHTML = "";
let pptxFile = null;

const NS = {
  a:  "http://schemas.openxmlformats.org/drawingml/2006/main",
  p:  "http://schemas.openxmlformats.org/presentationml/2006/main",
  r:  "http://schemas.openxmlformats.org/officeDocument/2006/relationships",
  pr: "http://schemas.openxmlformats.org/package/2006/relationships",
};

function qa(el, tag, ns)  { return Array.from(el.getElementsByTagNameNS(ns||NS.a, tag)); }
function q1(el, tag, ns)  { return el.getElementsByTagNameNS(ns||NS.a, tag)[0] || null; }
function parseXML(str)    { return new DOMParser().parseFromString(str, "application/xml"); }

// ─────────────────────────────────────────────────────────────────────────────
// UI helpers
// ─────────────────────────────────────────────────────────────────────────────
function setStatus(msg, state) {
  document.getElementById("smsg").textContent = msg;
  document.getElementById("sdot").className = "sdot" + (state ? " "+state : "");
}
function setProgress(pct) {
  const b = document.getElementById("pbar"), f = document.getElementById("pfill");
  b.className = pct < 100 ? "show" : "";
  f.style.width = pct + "%";
}

// ─────────────────────────────────────────────────────────────────────────────
// File input
// ─────────────────────────────────────────────────────────────────────────────
document.getElementById("fin").addEventListener("change", function() {
  const f = this.files[0]; if (!f) return;
  pptxFile = f;
  document.getElementById("fname").textContent = f.name;
  document.getElementById("cvt-btn").disabled = false;
  setStatus(`"${f.name}" ready`, "");
});

const dz = document.getElementById("dz");
dz.addEventListener("dragover",  e => { e.preventDefault(); dz.classList.add("drag"); });
dz.addEventListener("dragleave", ()=> dz.classList.remove("drag"));
dz.addEventListener("drop", e => {
  e.preventDefault(); dz.classList.remove("drag");
  const f = e.dataTransfer.files[0];
  if (!f || !f.name.match(/\.pptx$/i)) { setStatus("Drop a .pptx file",""); return; }
  pptxFile = f;
  document.getElementById("fname").textContent = f.name;
  document.getElementById("cvt-btn").disabled = false;
  setStatus(`"${f.name}" ready`, "");
});

// ─────────────────────────────────────────────────────────────────────────────
// Colour helpers
// ─────────────────────────────────────────────────────────────────────────────
function applyMod(val, mod, off) {
  // val 0-255, mod & off are 0-1 floats
  return Math.min(255, Math.max(0, Math.round(val * mod + 255 * off)));
}

function hexFromSchemeColor(name, themeDoc) {
  if (!themeDoc) return null;
  const clrScheme = q1(themeDoc.documentElement, "clrScheme");
  if (!clrScheme) return null;
  // find matching child
  const children = Array.from(clrScheme.childNodes).filter(n => n.nodeType===1);
  for (const ch of children) {
    const localName = ch.localName;
    if (localName !== name) continue;
    // srgbClr or sysClr
    const srgb = q1(ch,"srgbClr"); if (srgb) return "#"+srgb.getAttribute("val").toUpperCase();
    const sys  = q1(ch,"sysClr"); if (sys)  return "#"+(sys.getAttribute("lastClr")||"000000").toUpperCase();
  }
  return null;
}

// schemeClr val → theme colour key mapping
const SCHEME_MAP = {
  dk1:"dk1",lt1:"lt1",dk2:"dk2",lt2:"lt2",
  accent1:"accent1",accent2:"accent2",accent3:"accent3",
  accent4:"accent4",accent5:"accent5",accent6:"accent6",
  hlink:"hlink",folHlink:"folHlink",
  bg1:"lt1",bg2:"lt2",tx1:"dk1",tx2:"dk2",
};

function resolveSchemeClr(el, themeDoc) {
  const name = el.getAttribute("val");
  const key  = SCHEME_MAP[name] || name;
  let hex = hexFromSchemeColor(key, themeDoc);
  if (!hex) return null;
  // apply lumMod / lumOff
  const lumMod = el.getElementsByTagNameNS(NS.a,"lumMod")[0];
  const lumOff = el.getElementsByTagNameNS(NS.a,"lumOff")[0];
  const mod = lumMod ? parseInt(lumMod.getAttribute("val"))/100000 : 1;
  const off = lumOff ? parseInt(lumOff.getAttribute("val"))/100000 : 0;
  if (mod !== 1 || off !== 0) {
    const h = hex.replace("#","");
    const r = applyMod(parseInt(h.slice(0,2),16), mod, off);
    const g = applyMod(parseInt(h.slice(2,4),16), mod, off);
    const b = applyMod(parseInt(h.slice(4,6),16), mod, off);
    hex = "#" + [r,g,b].map(v=>v.toString(16).padStart(2,"0")).join("").toUpperCase();
  }
  return hex;
}

function resolveSolidFill(fillEl, themeDoc) {
  if (!fillEl) return null;
  const srgb    = q1(fillEl,"srgbClr");   if (srgb)    return "#"+srgb.getAttribute("val").toUpperCase();
  const scheme  = q1(fillEl,"schemeClr"); if (scheme)  return resolveSchemeClr(scheme, themeDoc);
  const prstClr = q1(fillEl,"prstClr");   if (prstClr) return PRESET[prstClr.getAttribute("val")] || null;
  const sysClr  = q1(fillEl,"sysClr");    if (sysClr)  return "#"+(sysClr.getAttribute("lastClr")||"000000").toUpperCase();
  return null;
}

const PRESET = {
  white:"#FFFFFF",black:"#000000",red:"#FF0000",green:"#008000",
  blue:"#0000FF",yellow:"#FFFF00",cyan:"#00FFFF",magenta:"#FF00FF",
  orange:"#FFA500",gray:"#808080",grey:"#808080",darkGray:"#444444",
  lightGray:"#C0C0C0",
};

function luminance(hex) {
  const h = hex.replace("#","");
  const [r,g,b] = [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255);
  const lin = c => c<=0.04045 ? c/12.92 : ((c+0.055)/1.055)**2.4;
  return 0.2126*lin(r) + 0.7152*lin(g) + 0.0722*lin(b);
}

// ─────────────────────────────────────────────────────────────────────────────
// Cell background
// ─────────────────────────────────────────────────────────────────────────────
function getCellBg(tcEl, themeDoc) {
  const tcPr = q1(tcEl, "tcPr");
  if (!tcPr) return null;

  // solidFill
  const sf = q1(tcPr,"solidFill");
  if (sf) { const c = resolveSolidFill(sf, themeDoc); if (c) return c; }

  // gradFill — use first stop
  const gf = q1(tcPr,"gradFill");
  if (gf) {
    const gs = q1(gf,"gs");
    if (gs) { const sf2 = q1(gs,"solidFill"); if (sf2) { const c = resolveSolidFill(sf2,themeDoc); if(c) return c; } }
  }

  // noFill → transparent
  const nf = q1(tcPr,"noFill");
  if (nf) return null;

  return null;
}

// ─────────────────────────────────────────────────────────────────────────────
// Run text → HTML (no span if nothing special needed)
// ─────────────────────────────────────────────────────────────────────────────
function getRunColor(rPrEl, themeDoc, paraDefColor) {
  if (!rPrEl) return paraDefColor;
  const sf = q1(rPrEl,"solidFill");
  if (sf) return resolveSolidFill(sf, themeDoc);
  return paraDefColor;
}

function runToHTML(rEl, themeDoc, paraDefColor) {
  // collect text
  let text = "";
  for (const t of qa(rEl,"t")) text += t.textContent;
  if (!text) return "";

  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  text = esc(text);

  const rPr = q1(rEl,"rPr");
  const bold      = rPr && rPr.getAttribute("b") === "1";
  const italic    = rPr && rPr.getAttribute("i") === "1";
  const underline = rPr && rPr.getAttribute("u") && rPr.getAttribute("u") !== "none";
  const strike    = rPr && rPr.getAttribute("strike") === "sngStrike";

  const styles = {};
  const color = getRunColor(rPr, themeDoc, paraDefColor);
  if (color) styles["color"] = color;

  const sz = rPr && rPr.getAttribute("lang"), szPt = rPr && rPr.getAttribute("sz");
  if (szPt) styles["font-size"] = (parseInt(szPt)/100) + "pt";

  const latin = rPr && q1(rPr,"latin");
  if (latin) { const tf = latin.getAttribute("typeface"); if (tf && tf !== "+mj-lt" && tf !== "+mn-lt") styles["font-family"] = `"${tf}"`; }

  const styleStr = Object.entries(styles).map(([k,v])=>`${k}:${v}`).join(";");
  const hasStyle = styleStr.length > 0;
  const hasTag   = bold||italic||underline||strike;

  let inner = text;
  if (bold)      inner = `<b>${inner}</b>`;
  if (italic)    inner = `<i>${inner}</i>`;
  if (underline) inner = `<u>${inner}</u>`;
  if (strike)    inner = `<s>${inner}</s>`;
  if (hasStyle)  inner = `<span style="${styleStr}">${inner}</span>`;
  return inner;
}

// ─────────────────────────────────────────────────────────────────────────────
// Paragraph → HTML <p>
// ─────────────────────────────────────────────────────────────────────────────
function getParaDefColor(pEl, themeDoc) {
  const pPr = q1(pEl,"pPr");
  if (!pPr) return null;
  const defRPr = q1(pPr,"defRPr");
  if (!defRPr) return null;
  const sf = q1(defRPr,"solidFill");
  return sf ? resolveSolidFill(sf, themeDoc) : null;
}

function paraToHTML(pEl, themeDoc) {
  const paraDefColor = getParaDefColor(pEl, themeDoc);

  // alignment
  const pPr = q1(pEl,"pPr");
  const algn = pPr ? (pPr.getAttribute("algn")||"l") : "l";
  const alignCSS = {c:"center",r:"right",just:"justify",dist:"justify"}[algn] || "left";

  const parts = [];
  for (const child of pEl.childNodes) {
    if (child.nodeType !== 1) continue;
    const ln = child.localName;
    if (ln === "r")  { parts.push(runToHTML(child, themeDoc, paraDefColor)); continue; }
    if (ln === "br") { parts.push("<br>"); continue; }
    // a:fld (field like slide number)
    if (ln === "fld") {
      let t = ""; for(const t2 of qa(child,"t")) t += t2.textContent;
      parts.push(t);
    }
  }

  const inner = parts.join("") || "&nbsp;";
  const styleStr = alignCSS !== "left" ? ` style="text-align:${alignCSS}"` : "";
  return `<p${styleStr}>${inner}</p>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// Cell → HTML content
// ─────────────────────────────────────────────────────────────────────────────
function cellToHTML(tcEl, themeDoc, autoTextColor) {
  const paras = qa(tcEl, "p");
  return paras.map(p => {
    let html = paraToHTML(p, themeDoc);
    // if no explicit colour anywhere in this paragraph, inject auto contrast
    if (autoTextColor && !html.includes("color:")) {
      html = html.replace("<p", `<p style="color:${autoTextColor}"`);
    }
    return html;
  }).join("\n");
}

// ─────────────────────────────────────────────────────────────────────────────
// Merge cell detection (gridSpan / rowSpan)
// ─────────────────────────────────────────────────────────────────────────────
function getCellSpan(tcEl) {
  const tcPr = q1(tcEl,"tcPr");
  if (!tcPr) return {colspan:1,rowspan:1,hMerge:false,vMerge:false};
  const gridSpan = parseInt(tcPr.getAttribute("gridSpan")||"1");
  const rowSpan  = parseInt(tcPr.getAttribute("rowSpan") ||"1");
  const hMerge   = tcPr.getAttribute("hMerge") === "1";
  const vMerge   = tcPr.getAttribute("vMerge") === "1";
  return {colspan:gridSpan, rowspan:rowSpan, hMerge, vMerge};
}

// ─────────────────────────────────────────────────────────────────────────────
// Table → HTML string
// ─────────────────────────────────────────────────────────────────────────────
function tableToHTML(tblEl, themeDoc, slideIdx, tblIdx, opts) {
  const rows = qa(tblEl,"tr");
  let totalRows = 0;
  const rowsHTML = [];

  const bdr  = opts.border  || "1px solid rgba(255,255,255,.12)";
  const pad  = opts.padding || "6px 10px";
  const width= opts.width   || "auto";

  rows.forEach((tr, ri) => {
    const cells = qa(tr,"tc");
    const cellsHTML = [];

    cells.forEach(tc => {
      const {colspan,rowspan,hMerge,vMerge} = getCellSpan(tc);
      if (hMerge || vMerge) return; // skip continuation cells

      const bg = getCellBg(tc, themeDoc);
      const autoText = bg ? (luminance(bg) < 0.45 ? "#FFFFFF" : "#111111") : null;
      const content  = cellToHTML(tc, themeDoc, autoText);

      const styleArr = [
        `border:${bdr}`,
        `padding:${pad}`,
        "vertical-align:top",
      ];
      if (bg) styleArr.push(`background-color:${bg}`);

      const colspanAttr = colspan > 1 ? ` colspan="${colspan}"` : "";
      const rowspanAttr = rowspan > 1 ? ` rowspan="${rowspan}"` : "";
      const tag = ri === 0 ? "th" : "td";
      cellsHTML.push(`    <${tag}${colspanAttr}${rowspanAttr} style="${styleArr.join(";")}">${content}</${tag}>`);
    });

    if (cellsHTML.length) {
      rowsHTML.push("  <tr>\n" + cellsHTML.join("\n") + "\n  </tr>");
      totalRows++;
    }
  });

  const label = `Slide ${slideIdx+1} — Table ${tblIdx+1}`;
  const tblStyle = `border-collapse:collapse;width:${width};font-family:system-ui,Arial,sans-serif;font-size:13px;`;

  return {
    html: `<div class="tbl-wrap">
  <div class="tbl-label">${label} <span class="arrow">&#8964;</span></div>
  <div class="tbl-inner"><table style="${tblStyle}">
${rowsHTML.join("\n")}
  </table></div>
</div>`,
    rows: totalRows
  };
}

// ─────────────────────────────────────────────────────────────────────────────
// Main convert entry point
// ─────────────────────────────────────────────────────────────────────────────
async function convert() {

  if (!pptxFile) return;

  setStatus("Uploading PPTX...", "busy");
  setProgress(10);

  document.getElementById("cvt-btn").disabled = true;

  try {

      const fd = new FormData();
      fd.append("pptFile", pptxFile);

      const response = await fetch(
          "https://ppt-table-converter.onrender.com/convert",
          {
              method: "POST",
              body: fd
          }
      );

      if (!response.ok) {
          throw new Error(
              `Server Error (${response.status})`
          );
      }

      const data = await response.json();

      if (!data.html) {
          throw new Error(data.error || "Conversion failed");
      }

      latestHTML = data.html;

      const parser = new DOMParser();
      const doc = parser.parseFromString(
          data.html,
          "text/html"
      );

        const styles = [
            ...doc.querySelectorAll("style")
        ]
        .map(s => s.outerHTML)
        .join("\n");

        const tables = [
            ...doc.querySelectorAll("table")
        ].map((tbl, idx) => `
            <div class="tbl-wrap">
              <div class="tbl-label">
                  Table ${idx + 1}
                  <span class="arrow">&#8964;</span>
              </div>
              <div class="tbl-inner">
                  ${tbl.outerHTML}
              </div>
            </div>
        `);

        latestHTML = data.html;

        renderPreview([
            styles,
            ...tables
        ], {});

      document.getElementById("dl-btn").disabled = false;
      document.getElementById("copy-btn").style.display = "inline-flex";

      setProgress(100);
      setStatus(
          "Conversion completed",
          "ok"
      );

  }
  catch(err){

      console.error(err);

      setStatus(
          err.message,
          ""
      );

      setProgress(100);
  }

  document.getElementById("cvt-btn").disabled = false;
}
// ─────────────────────────────────────────────────────────────────────────────
// Preview render
// ─────────────────────────────────────────────────────────────────────────────
function renderPreview(tablesHTML, opts) {
  document.getElementById("empty").style.display = "none";
  const tout = document.getElementById("tout");
  tout.style.display = "block";
  tout.innerHTML = tablesHTML.join("\n\n");

  // collapsible
  tout.querySelectorAll(".tbl-label").forEach(lbl => {
    const inner = lbl.nextElementSibling;
    lbl.addEventListener("click", () => {
      const hidden = inner.style.display === "none";
      inner.style.display = hidden ? "" : "none";
      lbl.classList.toggle("collapsed", !hidden);
    });
  });

  // font size override
  if (opts.fontSize) {
    tout.querySelectorAll("table").forEach(t => t.style.fontSize = opts.fontSize);
  }
}

function expandAll(show) {
  document.querySelectorAll("#tout .tbl-inner").forEach(el => el.style.display = show?"":"none");
  document.querySelectorAll("#tout .tbl-label").forEach(lbl => lbl.classList.toggle("collapsed",!show));
}

// ─────────────────────────────────────────────────────────────────────────────
// Search / highlight
// ─────────────────────────────────────────────────────────────────────────────
function doSearch(q) {
  const tout = document.getElementById("tout");
  tout.querySelectorAll("mark").forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
  tout.normalize();
  if (!q.trim()) { document.getElementById("matchcount").textContent=""; return; }
  let count = 0;
  const walk = node => {
    if (node.nodeType === 3) {
      const idx = node.textContent.toLowerCase().indexOf(q.toLowerCase());
      if (idx >= 0) {
        const mark = document.createElement("mark");
        const after = node.splitText(idx);
        after.splitText(q.length);
        mark.appendChild(after.cloneNode(true));
        after.parentNode.replaceChild(mark, after);
        count++;
      }
    } else if (node.nodeType===1 && !["SCRIPT","STYLE","MARK"].includes(node.tagName)) {
      [...node.childNodes].forEach(walk);
    }
  };
  walk(tout);
  document.getElementById("matchcount").textContent = count ? `${count} match${count>1?"es":""}` : "No matches";
}

// ─────────────────────────────────────────────────────────────────────────────
// Download / copy
// ─────────────────────────────────────────────────────────────────────────────
function downloadHTML() {
  const blob = new Blob([latestHTML],{type:"text/html;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "pptx_tables.html";
  a.click();
  URL.revokeObjectURL(a.href);
}
function copyHTML() {
  navigator.clipboard.writeText(latestHTML).then(()=>{
    setStatus("HTML copied to clipboard!","ok");
    setTimeout(()=>setStatus("Ready","ok"),2000);
  });
}
